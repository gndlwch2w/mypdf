name: Build and publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            command: package:mac
            backend_python: .venv/bin/python
            package_glob: release/*.dmg
          - name: Windows
            os: windows-2022
            command: package:win
            backend_python: .venv/Scripts/python.exe
            package_glob: release/*.exe
          - name: Linux
            os: ubuntu-22.04
            command: package:linux
            backend_python: .venv/bin/python
            package_glob: release/*.AppImage

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-build.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Install backend dependencies
        shell: bash
        run: |
          python -m venv .venv
          "${{ matrix.backend_python }}" -m pip install --upgrade pip
          "${{ matrix.backend_python }}" -m pip install -r backend/requirements.txt -r backend/requirements-build.txt

      - name: Build installer
        run: npm run ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: ${{ matrix.package_glob }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
